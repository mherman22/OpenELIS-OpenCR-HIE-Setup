name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  integration-test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start core HIE services
        run: |
          docker compose -f openelis-opencr-hie-docker-compose.yml up -d \
            mongo openhim-core openhim-console openhim-config \
            opencr-fhir es opencr \
            fhir.openelis.org

      - name: Wait for OpenHIM to be ready
        run: |
          echo "Waiting for OpenHIM Core..."
          for i in $(seq 1 30); do
            if docker exec openhim-core curl -sf -k https://localhost:8080/heartbeat > /dev/null 2>&1; then
              echo "OpenHIM Core is ready"
              break
            fi
            sleep 5
          done

      - name: Wait for OpenCR to be ready
        run: |
          echo "Waiting for OpenCR..."
          for i in $(seq 1 30); do
            if docker exec opencr-fhir curl -sf http://localhost:8080/fhir/metadata > /dev/null 2>&1; then
              echo "OpenCR FHIR is ready"
              break
            fi
            sleep 5
          done

      - name: Display service status
        run: docker compose -f openelis-opencr-hie-docker-compose.yml ps

      - name: Display OpenHIM config logs
        if: always()
        run: docker logs openhim-config 2>&1 | tail -20

      - name: Display OpenCR logs
        if: always()
        run: docker logs opencr 2>&1 | tail -30

      - name: Run integration tests
        if: hashFiles('.postman/1-general-tests.json') != ''
        run: |
          npm install -g newman
          newman run .postman/1-general-tests.json --insecure || true

      - name: Display all logs on failure
        if: failure()
        run: docker compose -f openelis-opencr-hie-docker-compose.yml logs --tail=50

      - name: Stop and clean up
        if: always()
        run: docker compose -f openelis-opencr-hie-docker-compose.yml down -v
